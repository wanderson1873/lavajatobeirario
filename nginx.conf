server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # usa a 404 do site em vez da página crua do nginx (mantém o status 404)
    error_page 404 /404.html;

    # HTML sempre revalidado: uma correção no site aparece na hora
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # imagens, css e js ficam no cache do navegador por 30 dias
    location ~* \.(webp|jpg|jpeg|png|svg|ico|css|js|woff2)$ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
