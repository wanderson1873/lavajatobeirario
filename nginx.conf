server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # www -> sem www: a URL canonica do site e lavajatobeirario.com.br
    if ($host ~* "^www\.(.+)$") {
        return 301 https://$1$request_uri;
    }

    # /index.html -> /: a home precisa ter uma URL so, a mesma da canonical e do sitemap.
    # Usa $request_uri (a URL que o visitante pediu) para nao pegar o redirecionamento
    # interno que o proprio nginx faz de "/" para "/index.html" — isso viraria loop.
    if ($request_uri ~ "^/index\.html") {
        return 301 https://$host/$is_args$args;
    }

    # usa a 404 do site em vez da página crua do nginx (mantém o status 404)
    error_page 404 /404.html;

    # HTML sempre revalidado: uma correção no site aparece na hora
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # imagens, css e js ficam no cache do navegador por 30 dias
    location ~* \.(webp|jpg|jpeg|png|svg|ico|css|js|woff2)$ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
